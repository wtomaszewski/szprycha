  - name: MAN-12 wyprzedzenie jadącego pojazdu na skrzyżowaniu bez świateł
    player: { x: 414, y: 615, speed: 4 }
    agents:
      [
        {
          id: auto,
          kind: car,
          x: 467,
          y: 655,
          speed: 1,
          inputs: [{ t: 1, x: 490 }],
        },
      ]
    inputs: [{ t: 1, x: 531 }]
    expect: { MAN-12: [major] }
    evidence: { MAN-12: { area: equal } }

  - name: MAN-12 zwykłe wyprzedzenie na odcinku bez zebr i skrzyżowań
    player: { x: 810, y: 615, speed: 5 }
    agents: *movingAuto
    inputs: [{ t: 1, x: 955 }]
    expect: { MAN-12: [] }
