  - name: MAN-08 sucha nawierzchnia pozwala zdążyć przed tym samym pieszym
    player: { x: 800, y: 670, speed: 3.5 }
    agents: [{ id: ped, kind: pedestrian, x: 881, y: 670 }]
    inputs: [{ t: 0.2, x: 814, speed: 0 }]
    expect: { MAN-08: [] }

  - name: MAN-12 pozostanie za pojazdem czekającym przed zebrą
    player: { x: 545, y: 665, speed: 3 }
    agents:
      &crossingAuto [
        { id: auto, kind: car, x: 630, y: 660, yieldingAtCrossing: true },
      ]
    inputs: [{ t: 0.7, x: 600, speed: 0 }]
    expect: { MAN-12: [] }

  - name: MAN-12 ominięcie pojazdu zatrzymanego dla pieszego przed zebrą
    player: { x: 545, y: 665, speed: 4 }
    agents: *crossingAuto
    inputs: [{ t: 0.65, x: 630, y: 628 }, { t: 1, x: 667 }]
    expect: { MAN-12: [major], MAN-04: [] }
    evidence: { MAN-12: { yieldingAtCrossing: true } }

  - name: MAN-12 samo zatrzymanie pojazdu przed zebrą nie ustala powodu
    player: { x: 545, y: 625, speed: 4 }
    agents: [{ id: auto, kind: car, x: 630, y: 660 }]
    inputs: [{ t: 1, x: 681 }]
    expect: { MAN-12: [] }

  - name: MAN-12 wyprzedzenie jadącego pojazdu bezpośrednio przed zebrą
    player: { x: 555, y: 630, speed: 4 }
    agents:
      [
        {
          id: auto,
          kind: car,
          x: 600,
          y: 660,
          speed: 1,
          inputs: [{ t: 1, x: 635 }],
        },
      ]
    inputs: [{ t: 1, x: 668 }]
