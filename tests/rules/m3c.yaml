  - name: MAN-07 spojrzenie przed ruszeniem od krawędzi
    player:
      {
        x: 553,
        y: 920,
        heading: -90,
        speed: 0,
        shoulderCheck: { lastLeftAt: 0.3 },
      }
    inputs: [{ t: 0.4, speed: 1 }, { t: 0.6, y: 913 }]
    expect: { MAN-07: [good] }

  - name: MAN-07 ruszenie z krawędzi bez sprawdzenia martwego pola
    player: { x: 554, y: 920, heading: -90, speed: 0 }
