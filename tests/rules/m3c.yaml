  - name: MAN-07 bardzo krótki postój nie otwiera epizodu ruszania
    player:
      {
        x: 553,
        y: 920,
        heading: -90,
        speed: 0,
        shoulderCheck: { lastLeftAt: 0 },
      }
    inputs: [{ t: 0.28, speed: 1 }]
    expect: { MAN-07: [] }

  - name: MAN-09 jedna ręka na kierownicy przy sygnalizowaniu
    player: { speed: 4, handsOnBar: 1, feetOnPedals: true, signal: left }
    expect: { MAN-09: [] }

  - name: MAN-09 brak obu rąk na kierownicy i tylko jeden werdykt
    player: { speed: 4, handsOnBar: 0, feetOnPedals: true }
    expect: { MAN-09: [minor] }

  - name: MAN-09 prowadzenie roweru bez nóg na pedałach jest prawidłowe
    player: { mode: walking_bike, speed: 1, handsOnBar: 1, feetOnPedals: false }
    expect: { MAN-09: [] }

  - name: MAN-09 nogi poza pedałami podczas jazdy
    player: { speed: 2, handsOnBar: 2, feetOnPedals: false }
    expect: { MAN-09: [minor] }

  - name: MAN-10 jazda samemu jest poprawna
    player: { speed: 4, passenger: false }
    expect: { MAN-10: [] }

  - name: MAN-10 przewożenie pasażera na jednoosobowym rowerze
    player: { speed: 4, passenger: true }
    expect: { MAN-10: [major] }

  - name: MAN-10 podczas postoju pasażer schodzi przed ruszeniem
    player: { speed: 0, passenger: true }
    inputs: [{ t: 0.4, passenger: false }, { t: 0.6, speed: 3 }]
    expect: { MAN-10: [] }

  - name: MAN-11 odebranie telefonu po bezpiecznym zatrzymaniu
    player: { x: 680, y: 1000, speed: 0, phoneInHand: false }
    inputs: [{ t: 0.35, phoneInHand: true }]
    expect: { MAN-11: [good] }

  - name: MAN-11 telefon w ręku podczas jazdy
    player: { speed: 4, phoneInHand: true }
    expect: { MAN-11: [minor] }

  - name: MAN-11 postój na jezdni w ruchu nie daje bonusu
    player: { x: 528, y: 926, speed: 0, phoneInHand: true }
    expect: { MAN-11: [] }

  - name: MSC-01 otwarta zapora i wyłączony sygnał
    player: { x: 2190, y: 1734, heading: -90, speed: 3 }
    inputs: [{ t: 1, y: 1652 }]
    expect: { MSC-01: [] }

  - name: MSC-01 zapora jeszcze otwarta przy czerwonym migającym sygnale
    env: { railOverrides: { rail-crossing: { barrier: open, flashing: true } } }
    player: { x: 2190, y: 1734, heading: -90, speed: 3 }
    inputs: [{ t: 1, y: 1652 }]
    expect: { MSC-01: [major] }

  - name: MSC-01 podnosząca się zapora nadal zakazuje wjazdu
    env:
      {
        railOverrides: { rail-crossing: { barrier: raising, flashing: false } },
      }
    player: { x: 2190, y: 1734, heading: -90, speed: 3 }
    inputs: [{ t: 1, y: 1652 }]
    expect: { MSC-01: [major] }

  - name: MSC-01 wyprzedzenie jadącego roweru przed przejazdem
    player: { x: 2190, y: 1835, heading: -90, speed: 4 }
    agents:
      [{ id: cyclist, kind: cyclist, x: 2208, y: 1797, heading: -90, speed: 1 }]
    inputs: [{ t: 0.9, y: 1769 }]
    expect: { MSC-01: [minor] }

  - name: MSC-01 zatrzymanie na torach po wjeździe przy otwartym przejeździe
    player: { x: 2190, y: 1734, heading: -90, speed: 3 }
    duration: 1.6
    inputs: [{ t: 0.5, y: 1697, speed: 0 }]
    expect: { MSC-01: [major] }
    evidence: { MSC-01: { stoppedOnTracks: true } }

  - name: MSC-02 postój przed przystankiem do zakończenia wysiadania
    player: { x: 1070, y: 656, heading: 0, speed: 0 }
    agents:
      [
        {
          id: tram,
          kind: tram,
          x: 1120,
          y: 608,
          stopId: stop-without-island,
          leaveAt: 0.6,
        },
      ]
    inputs: [{ t: 0.65, speed: 3 }, { t: 0.95, x: 1150 }]
    expect: { MSC-02: [good] }

  - name: MSC-02 wjazd w strefę podczas wysiadania
    player: { x: 1069, y: 656, heading: 0, speed: 4 }
    agents:
      [{ id: tram, kind: tram, x: 1120, y: 608, stopId: stop-without-island }]
    inputs: [{ t: 0.8, x: 1150 }]
    expect: { MSC-02: [major] }

  - name: MSC-02 przejeżdżający tramwaj nie aktywuje przystanku
    player: { x: 1070, y: 656, heading: 0, speed: 4 }
    agents: [{ id: tram, kind: tram, x: 1120, y: 608, heading: 0, speed: 5 }]
    inputs: [{ t: 0.8, x: 1150 }]
    expect: { MSC-02: [] }

  - name: MSC-03 postój przed chodnikiem i przepuszczenie pieszego
    player: { x: 1134, y: 1520, heading: -90, speed: 0 }
    agents:
      [
        {
          id: pedestrian,
          kind: pedestrian,
          x: 1134,
          y: 1488,
          speed: 1,
          leaveAt: 0.45,
        },
      ]
    inputs: [{ t: 0.5, speed: 2 }, { t: 0.95, y: 1464 }]
    expect: { MSC-03: [good], PIER-06: [] }

  - name: MSC-03 wyjazd z posesji bez postoju
    player: { x: 1134, y: 1520, heading: -90, speed: 3 }
    inputs: [{ t: 0.7, y: 1452 }]
    expect: { MSC-03: [minor], PIER-06: [] }

  - name: MSC-03 wymuszenie przy bramie daje jeden werdykt
    player: { x: 1134, y: 1520, heading: -90, speed: 3 }
    agents: [{ id: pedestrian, kind: pedestrian, x: 1134, y: 1490, speed: 0 }]
    inputs: [{ t: 0.68, y: 1455 }]
    expect: { MSC-03: [major], PIER-06: [] }

  - name: MSC-03 jazda wzdłuż jezdni obok wyjazdu jest neutralna
    player: { x: 1080, y: 1458, heading: 0, speed: 3 }
    inputs: [{ t: 1, x: 1180 }]
    expect: { MSC-03: [], PIER-06: [] }

  - name: MSC-04 włączenie obu świateł daje raz dobry nawyk
    env: { time: dusk }
    player: { speed: 3, lights: { front: false, rear: false } }
    inputs:
      - { t: 0.2, lights: { front: true, rear: true } }
      - { t: 0.4, lights: { front: false, rear: false } }
      - { t: 0.8, lights: { front: true, rear: true } }
    expect: { MSC-04: [minor, good, minor], WYP-04: [], WYP-05: [] }

  - name: MSC-04 brak obu lamp we mgle daje jeden werdykt
    env: { weather: fog }
    player: { speed: 3, lights: { front: false, rear: false } }
    expect: { MSC-04: [minor], WYP-04: [], WYP-05: [] }

  - name: MSC-04 jazda w pogodny dzień bez włączania lamp
    player: { speed: 3, lights: { front: false, rear: false } }
    expect: { MSC-04: [], WYP-04: [], WYP-05: [] }

  - name: WYP-04 tylko przednia lampa jest wyłączona w nocy
    env: { time: night }
    player: { speed: 3, lights: { front: false, rear: true } }
    expect: { WYP-04: [minor], MSC-04: [] }

  - name: WYP-04 brak przedniego światła po zmroku i naprawienie sytuacji
    env: { time: dusk }
    player: { speed: 3, lights: { front: false, rear: true } }
    inputs: [{ t: 0.5, lights: { front: true, rear: true } }]
    expect: { WYP-04: [minor, good], MSC-04: [] }

  - name: WYP-04 i WYP-05 prowadzenie roweru z wyłączonymi lampami
    env: { time: night }
    player:
      { speed: 1, mode: walking_bike, lights: { front: false, rear: false } }
    expect: { WYP-04: [], WYP-05: [], MSC-04: [] }

  - name: WYP-05 brak tylnego światła w nocy
    env: { time: night }
    player: { speed: 3, lights: { front: true, rear: false } }
    expect: { WYP-05: [minor], MSC-04: [] }

  - name: WYP-05 tylne światło włączone przez całą jazdę w deszczu
    env: { weather: rain_heavy }
    player: { speed: 3, lights: { front: true, rear: true } }
    expect: { WYP-05: [], MSC-04: [] }

  - name: MSC-04 włączenie lamp przed ruszeniem też zasługuje na jeden bonus
    env: { time: dusk }
    player: { speed: 0, lights: { front: false, rear: false } }
    inputs:
      [{ t: 0.2, lights: { front: true, rear: true } }, { t: 0.4, speed: 2 }]
    expect: { MSC-04: [good], WYP-04: [], WYP-05: [] }
