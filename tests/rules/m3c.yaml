      [{ id: rear, kind: cyclist, x: 550, y: 736, heading: -90, speed: 3 }]
    inputs: [{ t: 0.35, y: 668 }, { t: 0.75, x: 490, heading: 180 }]
    expect: { MAN-03: [] }

  - name: MAN-06 minięcie auta z odstępem ponad metr
    player: { x: 875, y: 1338, heading: 0, speed: 4 }
