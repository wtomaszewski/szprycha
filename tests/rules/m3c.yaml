  - name: MAN-06 odstęp dokładnie metr nie daje pochwały
    player: { x: 880, y: 1329.3333333333333, heading: 0, speed: 4 }
    inputs: [{ t: 1, x: 1060 }]
    expect: { MAN-06: [minor] }

  - name: MAN-06 postój przed samochodem nie oznacza jego minięcia
    player: { x: 911, y: 1338, heading: 0, speed: 0 }
