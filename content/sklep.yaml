nazwa: 'Szprycha: Miejscy Kurierzy'
krotki_opis: 'Ruszaj w miasto na rowerze i ćwicz bezpieczną jazdę. Gra działa offline.'
pelny_opis: |-
  Rozwoź przesyłki rowerem w pikselowej Warszawie i we Wrocławiu. Odbieraj zlecenia, poznawaj miasto i zdobywaj punkty za bezpieczne decyzje na drodze.

  Zapnij kask, włącz światła po zmroku i prowadź rower na przejściu dla pieszych. Ćwicz manewry na placu, odkrywaj znaki do albumu i śledź swoje postępy na Mapie Umiejętności. Powtarzaj zasady w quizie i sprawdź się w egzaminie próbnym w grze.

  Szprycha to pomoc edukacyjna w nauce zasad ruchu drogowego. Licencja Szprychy nie jest kartą rowerową.

  Gra działa offline, bez reklam i zakupów w aplikacji.
slowa_kluczowe: 'rower,karta rowerowa,znaki,bezpieczeństwo,quiz,plac manewrowy,kurier,przepisy'
