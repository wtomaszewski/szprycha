nazwa: 'Szprycha: Miejscy Kurierzy'
krotki_opis: 'Ruszaj w miasto na rowerze i ćwicz bezpieczną jazdę. Gra działa offline.'
pelny_opis: |-
  Rozwoź przesyłki rowerem w pikselowym kolażu polskich miast i wsi w skali mikro. Podejmuj zlecenia w kampaniach Warszawy, Wrocławia, Krakowa, Gdańska, Poznania, Łodzi i Zakopanego oraz na mapie Wieś i las. Odkrywaj znajdźki, takie jak szyszki, szpulki i drewniane świerki, i zdobywaj punkty za bezpieczne decyzje na drodze.

  Zapnij kask, włącz światła po zmroku i prowadź rower na przejściu dla pieszych. W Miasteczku Ruchu Drogowego poznaj podstawy jazdy. Ćwicz na placu manewrowym, zbieraj znaki do albumu i śledź swoje postępy na Mapie Umiejętności. Powtarzaj zasady w quizie i sprawdź się w egzaminie próbnym w grze.

  Szprycha to pomoc edukacyjna w nauce zasad ruchu drogowego. Licencja Szprychy nie jest kartą rowerową.

  Gra działa offline, bez reklam i zakupów w aplikacji.
