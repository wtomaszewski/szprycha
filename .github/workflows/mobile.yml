name: Mobile quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - name: Set up FFmpeg
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: npm run build -- --mode mobile
      - run: npx --no-install cap sync android
      - run: ./gradlew --no-daemon :app:assembleDebug
        working-directory: android
      - run: python3 tools/check-mobile.py android android/app/build/outputs/apk/debug/app-debug-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: szprycha-debug-unsigned
          path: android/app/build/outputs/apk/debug/app-debug-unsigned.apk
          if-no-files-found: error

  ios-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Set up FFmpeg
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: npm run build -- --mode mobile
      - run: npx --no-install cap sync ios
      - run: python3 tools/check-mobile.py ios
      - run: npm run assets:mobile
      - run: git diff --exit-code -- ios android
